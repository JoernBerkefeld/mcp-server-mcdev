name: Code Testing

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lintandTesting:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                node: ['22.22.2', '24.15.0', 24, 25]
                os: [ubuntu-latest, windows-latest, macos-latest]
        name: lint & test on ${{ matrix.os }} w/ node v${{ matrix.node }}
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}

            - run: npm ci --no-workspaces
            - run: npm run lint
            - run: npm run build
            - run: npm test
